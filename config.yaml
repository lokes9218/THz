# THz Non-Invasive Glucose Estimation Prototype Configuration

simulation:
  seed: 42
  freq_min_thz: 0.1
  freq_max_thz: 2.0
  num_freq_points: 200

patient_default:
  glucose_mg_dl: 120.0
  temperature_c: 32.0
  humidity_pct: 50.0
  skin_thickness_mm: 1.8
  sensor_distance_cm: 5.0
  noise_level_pct: 1.5

tissue_layers:
  stratum_corneum:
    thickness_mm: 0.02
    eps_infinity: 2.1
    delta_eps: 3.5
    tau_ps: 0.12
  epidermis:
    thickness_mm: 0.08
    eps_infinity: 2.5
    delta_eps: 5.0
    tau_ps: 0.15
  dermis:
    thickness_mm: 1.50
    eps_infinity: 3.2
    delta_eps: 25.0
    tau_ps: 8.5
  subcutaneous:
    thickness_mm: 2.00
    eps_infinity: 2.2
    delta_eps: 4.0
    tau_ps: 0.20

debye_glucose_sensitivity:
  eps_real_slope: 0.0012   # per mg/dL offset from 100 mg/dL
  eps_imag_slope: 0.0025   # loss factor per mg/dL offset from 100 mg/dL

dataset:
  num_samples: 2000
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

holography:
  grid_size_x: 32
  grid_size_y: 32
  spatial_step_mm: 0.25
  depth_max_mm: 2.0
  depth_steps: 32
